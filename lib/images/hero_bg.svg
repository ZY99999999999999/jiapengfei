<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000"/>
      <stop offset="30%" style="stop-color:#DC143C"/>
      <stop offset="60%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#FFF8DC;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="400" fill="url(#bg)"/>
  <!-- 装饰纹样 -->
  <g opacity="0.15" fill="none" stroke="#FFD700" stroke-width="2">
    <!-- 盘长纹 左 -->
    <g transform="translate(120,200) rotate(45) scale(2)">
      <rect x="-20" y="-20" width="40" height="40" rx="5"/>
      <rect x="-10" y="-30" width="20" height="60" rx="10"/>
      <rect x="-30" y="-10" width="60" height="20" rx="10"/>
    </g>
    <!-- 回纹 中左 -->
    <g transform="translate(350,200) scale(1.5)">
      <polyline points="-30,30 -30,-30 30,-30 30,10 -10,10 -10,-10 10,-10 10,0 0,0"/>
    </g>
    <!-- 云纹 中 -->
    <g transform="translate(500,200) scale(2)">
      <path d="M -25 20 C -25 -10 0 -15 0 0 C 0 15 25 10 25 -20" stroke-width="3" stroke-linecap="round"/>
      <path d="M -35 10 C -35 -30 0 -35 0 -15 C 0 5 35 0 35 -30" stroke-linecap="round"/>
    </g>
    <!-- 宝相花 中右 -->
    <g transform="translate(680,200) scale(1.8)">
      <circle cx="0" cy="0" r="30" stroke-dasharray="6 4"/>
      <path d="M 0 -8 C 15 -15 18 -30 0 -35 C -18 -30 -15 -15 0 -8" fill="#FFD700" fill-opacity="0.1"/>
      <path d="M 0 -8 C 15 -15 18 -30 0 -35 C -18 -30 -15 -15 0 -8" transform="rotate(45)"/>
      <path d="M 0 -8 C 15 -15 18 -30 0 -35 C -18 -30 -15 -15 0 -8" transform="rotate(90)"/>
      <path d="M 0 -8 C 15 -15 18 -30 0 -35 C -18 -30 -15 -15 0 -8" transform="rotate(135)"/>
      <path d="M 0 -8 C 15 -15 18 -30 0 -35 C -18 -30 -15 -15 0 -8" transform="rotate(180)"/>
      <path d="M 0 -8 C 15 -15 18 -30 0 -35 C -18 -30 -15 -15 0 -8" transform="rotate(225)"/>
      <path d="M 0 -8 C 15 -15 18 -30 0 -35 C -18 -30 -15 -15 0 -8" transform="rotate(270)"/>
      <path d="M 0 -8 C 15 -15 18 -30 0 -35 C -18 -30 -15 -15 0 -8" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="8"/>
    </g>
    <!-- 卷草纹 右 -->
    <g transform="translate(880,200) scale(2)">
      <path d="M -20 30 C 0 -10 20 -30 40 -20" stroke-linecap="round"/>
      <path d="M -10 20 C 10 -10 30 -10 30 20 C 30 30 20 30 15 25" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 顶部装饰带 -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#gold)"/>
  <rect x="0" y="397" width="1000" height="3" fill="url(#gold)"/>
  <!-- 中央文字装饰 -->
  <text x="500" y="190" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="300" letter-spacing="20" opacity="0.25">MONGOLIAN PATTERN ART</text>
  <text x="500" y="230" text-anchor="middle" fill="#FFD700" font-size="12" letter-spacing="8" opacity="0.2">非遗传承 · 数字新生</text>
</svg>
