<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1540" role="img" aria-labelledby="title desc">
  <title id="title">纹样粒子世界 · 全景构图平面位置图</title>
  <desc id="desc">独立的粒子世界俯视位置参考图。北方与远景为负 Z，横向为 X；标出五座火山、五畜、河流、步道、岩石和红层崖体。</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0a1c27"/></linearGradient>
    <linearGradient id="field" x2="0" y2="1"><stop stop-color="#132b32"/><stop offset="1" stop-color="#173527"/></linearGradient>
    <pattern id="grid" width="70" height="87.5" patternUnits="userSpaceOnUse"><path d="M70 0H0V87.5" fill="none" stroke="#9ab0af" stroke-opacity=".16" stroke-width="1"/><circle cx="0" cy="0" r="1.7" fill="#cad6cd" fill-opacity=".36"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#dfc77f"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#e9e7dc}.muted{fill:#9baeb2}.tiny{font-size:12px;letter-spacing:.06em}.small{font-size:14px}.label{font-size:16px;font-weight:600}.heading{font-size:20px;font-weight:600;letter-spacing:.08em}.coord{font:12px ui-monospace,Consolas,monospace;fill:#8ea7ae}.panel{fill:#0d1d2b;stroke:#c8ab69;stroke-opacity:.25}.volcano{cursor:move}.volcano circle{fill:#17293d;fill-opacity:.9;stroke-width:2.5;stroke-dasharray:7 5}.volcano text{paint-order:stroke;stroke:#08121d;stroke-width:4px;stroke-linejoin:round}.movehint{fill:#dfc77f}
    </style>
  </defs>
  <rect width="1320" height="1540" fill="url(#bg)"/>
  <text x="56" y="55" class="tiny" fill="#d5ba7a">MOTIF PARTICLE WORLD · PLAN VIEW</text>
  <text x="56" y="100" font-size="34" font-family="STKaiti,KaiTi,serif" fill="#f3dfaa">纹样粒子世界｜全景构图平面图</text>
  <text x="56" y="132" class="small muted">俯视 · X 横向 / Z 纵向 · 按参考画面的横向山群与近景留白调整，坐标与场景代码同步</text>
