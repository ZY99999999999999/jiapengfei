  <text x="944" y="211" class="heading" fill="#f3dfaa">全景构图坐标</text>
  <text x="944" y="242" class="tiny muted">环形虚线是火山艺术底座占地示意，按当前模型半径绘制。</text>
  <g font-size="15">
    <text x="944" y="292" fill="#f1c26c">设计峰01 黑脑包（景区4号）</text><text x="944" y="316" class="coord">X −62  /  Z −153  /  底径≈61</text>
    <text x="944" y="358" fill="#e56d69">设计峰02 北炼丹炉（景区3号）</text><text x="944" y="382" class="coord">X 75  /  Z −200  /  底径≈55</text>
    <text x="944" y="424" fill="#f5d48b">设计峰03 中炼丹炉（景区5号）</text><text x="944" y="448" class="coord">X 0  /  Z −250  /  底径≈77</text>
    <text x="944" y="490" fill="#ed9b53">设计峰04 南炼丹炉（景区6号）</text><text x="944" y="514" class="coord">X 110  /  Z −100  /  底径≈53</text>
    <text x="944" y="556" fill="#69c9b8">设计峰05 北尖山（景区7号）</text><text x="944" y="580" class="coord">X −85  /  Z −52  /  底径≈51</text>
  </g>
