  <rect x="940" y="958" width="292" height="164" rx="12" fill="#152638" stroke="#dfc77f" stroke-opacity=".34"/>
  <text x="960" y="992" class="label movehint">你可以这样改图</text>
  <text x="960" y="1024" class="small muted">1. 在图上圈出或标记 01–05 的新位置。</text>
  <text x="960" y="1053" class="small muted">2. 附上新坐标，格式：X / Z。</text>
  <text x="960" y="1082" class="small muted">3. 标记河道、牧群、岩石是否跟着移。</text>
  <text x="944" y="1162" class="small" fill="#e4c98d">当前判读</text>
  <text x="944" y="1192" class="tiny muted">五峰位于 Z −45 至 −250；草原与动物</text>
  <text x="944" y="1215" class="tiny muted">集中在 Z −78 至 50。艺术峰底座较大，</text>
  <text x="944" y="1238" class="tiny muted">虚线相交表示现有位置可能发生遮挡，</text>
  <text x="944" y="1261" class="tiny muted">不代表地貌测量或真实火山位置。</text>
  <text x="944" y="1350" class="tiny" fill="#d5ba7a">编辑建议</text>
  <text x="944" y="1378" class="tiny muted">图中留白可用绘图软件圈画并回传</text>
  <text x="944" y="1400" class="tiny muted">供你圈画；以中心十字/菱形为坐标点。</text>
  <text x="944" y="1448" class="tiny muted">源坐标：scene.js / living-motifs.js / volcano-world.js</text>
  <text x="56" y="1510" class="tiny muted">说明：地貌边界与点状符号为平面示意；位置来自当前代码。请按你的总体构图调整后回传这张 SVG 或写出新坐标。</text>
